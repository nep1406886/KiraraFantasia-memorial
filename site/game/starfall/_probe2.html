<!doctype html><html><head><meta charset="utf-8"><title>probe2</title>
<style>html,body{margin:0;height:100%;background:#1c2040;overflow:hidden}#c{position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.min.js"}}</script>
</head><body><canvas id="c"></canvas><pre id="log" style="position:absolute;left:0;top:0;color:#fff;font:12px monospace;white-space:pre-wrap"></pre>
<script type="module">
import * as THREE from 'three';
import * as loader from '../../core/loader.js';
import * as actorlib from '../../core/actor.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-innerWidth/2,innerWidth/2,innerHeight/2,-innerHeight/2,-1000,1000);
camera.position.z=100;
scene.add(new THREE.HemisphereLight(0xffffff,0x554466,2.2));
const d=new THREE.DirectionalLight(0xffffff,1.6); d.position.set(-2,4,5); scene.add(d);
function place(obj,height,x,y){ const box=new THREE.Box3().setFromObject(obj); const s=box.getSize(new THREE.Vector3()); const k=height/s.y; obj.scale.setScalar(k); const b2=new THREE.Box3().setFromObject(obj); obj.position.x=x-(b2.min.x+b2.max.x)/2; obj.position.y=y-b2.min.y; return obj; }
(async()=>{
  const actor=await actorlib.create({resourceId:100004,classId:3,headId:0,weapon:'default'});
  place(actor.object,160,-200,-180); scene.add(actor.object);
  document.getElementById('log').textContent = 'PLAYER actions: '+actor.actionNames.join(', ')+'\n';
  const names=[10000,10100,10300,10400,10500,1400,1700];
  let x=-60;
  for(const id of names){
    try{
      const en=await loader.load('model/enemy/model_en_'+id+'.muast',{kind:'enemy'});
      const size=new THREE.Box3().setFromObject(en.scene).getSize(new THREE.Vector3());
      place(en.scene,100,x,-180); scene.add(en.scene); x+=120;
      document.getElementById('log').textContent += id+' size '+size.toArray().map(v=>v.toFixed(2)).join(' x ')+' anims '+(en.animations||[]).map(a=>a.name).join(',')+'\n';
    }catch(e){ document.getElementById('log').textContent += id+' ERR '+e.message+'\n'; }
  }
  const clock=new THREE.Clock();
  let t=0;
  function loop(){ const dt=clock.getDelta(); t+=dt; actor.update(dt); if(t>3 && t<3.1) actor.play('attack',{loop:false}); if(t>5 && t<5.1) actor.play('class_skill_1',{loop:false}); renderer.render(scene,camera); requestAnimationFrame(loop);} loop();
  window.__ready=true;
})().catch(e=>{document.title='ERR '+e.message; console.error(e)});
</script></body></html>
