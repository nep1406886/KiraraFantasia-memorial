<!doctype html><html><head><meta charset="utf-8"><title>probe5</title>
<style>html,body{margin:0;height:100%;background:#2a2348;overflow:hidden}#c{position:absolute;inset:0}#log{position:absolute;left:4px;top:4px;color:#fff;font:11px monospace;white-space:pre-wrap;max-height:260px;overflow:auto}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.min.js"}}</script>
</head><body><canvas id="c"></canvas><pre id="log"></pre>
<script type="module">
import { Stage3D } from './src/models.js';
import { CHARACTERS } from './src/config.js';
import * as THREE from 'three';
const stage=new Stage3D(document.getElementById('c'));
stage.resize(960,540,2);
(async()=>{
  const handle=await stage.addPlayer(CHARACTERS[2]);
  handle.move(480,438);
  handle.play('idle',{fade:0});
  const log=document.getElementById('log');
  const faceNodes=[];
  handle.inner.traverse(n=>{ const name=(n.userData.name||n.name||''); if(/eye|mouth|cheek|face|brow/i.test(name)) faceNodes.push(n); });
  let txt='face nodes '+faceNodes.length+'\n';
  const box=new THREE.Box3();
  faceNodes.slice(0,20).forEach(n=>{ box.setFromObject(n); const p=box.getCenter(new THREE.Vector3()); txt+= (n.userData.name||n.name)+' pos '+p.toArray().map(v=>v.toFixed(2)).join(',')+'\n'; });
  log.textContent=txt;
  const clock=new THREE.Clock();
  function loop(){ handle.update(clock.getDelta()); stage.render(0,0,0,0); requestAnimationFrame(loop);} loop();
  window.__ready=true;
})().catch(e=>{document.title='ERR '+e.message;console.error(e)});
</script></body></html>
