<!doctype html><html><head><meta charset="utf-8"><title>probe3</title>
<style>html,body{margin:0;height:100%;background:#1c2040;overflow:hidden}#c{position:absolute;inset:0}#log{position:absolute;left:0;top:0;color:#fff;font:12px monospace;white-space:pre-wrap}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.min.js"}}</script>
</head><body><canvas id="c"></canvas><pre id="log"></pre>
<script type="module">
import * as THREE from 'three';
import * as loader from '../../core/loader.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-innerWidth/2,innerWidth/2,innerHeight/2,-innerHeight/2,-1000,1000); camera.position.z=100;
scene.add(new THREE.HemisphereLight(0xffffff,0x554466,2.2)); const d=new THREE.DirectionalLight(0xffffff,1.6); d.position.set(-2,4,5); scene.add(d);
function place(obj,height,x,y){ const box=new THREE.Box3().setFromObject(obj); const s=box.getSize(new THREE.Vector3()); const k=height/s.y; obj.scale.setScalar(k); const b2=new THREE.Box3().setFromObject(obj); obj.position.x=x-(b2.min.x+b2.max.x)/2; obj.position.y=y-b2.min.y; return obj; }
(async()=>{
  let x=-520; const log=document.getElementById('log'); let txt='';
  for(const id of [1000,1100,1200,1300,1400,1500,1600,1700]){
    try{ const en=await loader.load('model/enemy/model_en_'+id+'.muast',{kind:'enemy'}); const size=new THREE.Box3().setFromObject(en.scene).getSize(new THREE.Vector3()); place(en.scene,190,x,-260); scene.add(en.scene); x+=150; txt+=id+' '+size.toArray().map(v=>v.toFixed(2)).join('x')+'\n'; }catch(e){txt+=id+' ERR '+e.message+'\n';}
  }
  log.textContent=txt;
  const clock=new THREE.Clock();
  function loop(){ const dt=clock.getDelta(); scene.traverse(o=>{ if(o.userData.mixer) o.userData.mixer.update(dt); }); renderer.render(scene,camera); requestAnimationFrame(loop);} loop();
})().catch(e=>{document.title='ERR '+e.message});
</script></body></html>
