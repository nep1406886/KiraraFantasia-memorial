<!doctype html><html><head><meta charset="utf-8"><title>probe4</title>
<style>html,body{margin:0;height:100%;background:#252045;overflow:hidden}#c{position:absolute;inset:0}#log{position:absolute;left:4px;top:4px;color:#fff;font:11px monospace;white-space:pre-wrap}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.min.js"}}</script>
</head><body><canvas id="c"></canvas><pre id="log"></pre>
<script type="module">
import * as THREE from 'three';
import * as actorlib from '../../core/actor.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-innerWidth/2,innerWidth/2,innerHeight/2,-innerHeight/2,-1000,1000); camera.position.z=100;
scene.add(new THREE.HemisphereLight(0xffffff,0x554466,2.2)); const d=new THREE.DirectionalLight(0xffffff,1.6); d.position.set(-2,4,5); scene.add(d);
function place(obj,height,x,y){ const box=new THREE.Box3().setFromObject(obj); const s=box.getSize(new THREE.Vector3()); const k=height/s.y; obj.scale.setScalar(k); const b2=new THREE.Box3().setFromObject(obj); obj.position.x=x-(b2.min.x+b2.max.x)/2; obj.position.y=y-b2.min.y; return obj; }
const ROSTER=[[320002,2,'Kirara'],[170004,3,'Chiya'],[300004,0,'Cocoa'],[150004,1,'Aoba'],[321702,4,'Uzuzu'],[140004,0,'Karen']];
(async()=>{
  let x=-500; const log=document.getElementById('log'); let txt=''; const actors=[];
  for(const [rid,cid,name] of ROSTER){
    try{ const a=await actorlib.create({resourceId:rid,classId:cid,headId:0,weapon:'default'}); place(a.object,150,x,-190); scene.add(a.object); actors.push(a); x+=200;
      txt+=name+' class'+cid+' actions '+a.actionNames.join(',')+'\n'; }
    catch(e){ txt+=name+' ERR '+e.message+'\n'; }
  }
  log.textContent=txt;
  const clock=new THREE.Clock(); let t=0;
  function loop(){ const dt=clock.getDelta(); t+=dt; actors.forEach((a,i)=>{ a.update(dt); const ph=(t+i*0.7)%6; if(ph>0.0&&ph<0.05) a.play('attack',{loop:false}); }); renderer.render(scene,camera); requestAnimationFrame(loop);} loop();
  window.__ready=true;
})().catch(e=>{document.title='ERR '+e.message; console.error(e)});
</script></body></html>
