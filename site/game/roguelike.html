<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百物語の残页 — きらファン外传</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: var(--kf-sky);
        color: var(--kf-ink);
        font: 14px/1.5 var(--font-sans);
    }
    body {
        display: flex;
        flex-direction: column;
    }
    #bar {
        flex: none;
        padding: 8px 14px;
        background: var(--kf-paper);
        border-bottom: 1px solid var(--kf-ink-soft);
        display: flex;
        gap: 12px;
        align-items: baseline;
    }
    #bar h1 {
        margin: 0;
        flex: 0 0 auto;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 600;
        font-family: var(--font-serif);
        color: var(--kf-ink);
    }
    #status {
        min-width: 0;
        color: var(--kf-ink-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    @media (max-width:600px) {
        #bar { gap:8px; padding:6px 12px; }
        #bar h1 { font-size:12px; max-width:64%; overflow:hidden; text-overflow:ellipsis; }
        #status { font-size:11px; }
    }
    #stage {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
    }
    #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    #minimap {
        position: absolute;
        top: 12px;
        right: 12px;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 12px;
        padding: 8px;
        box-shadow: 0 2px 0 var(--kf-shadow);
        pointer-events: none;
    }
    /* The floor colour is authored per 卷 and ranges from volume 1's pale sand
       to volume 5's night slate, so the hint is an opaque paper chip (same
       treatment as the minimap): it owes the scene nothing and stays legible
       on every floor. */
    #hint {
        position: absolute;
        /* Sits above the skill bar (bottom-left) instead of beside it: at
           375px the corners are owned by the skill icons and the gauge, and
           the middle of the bottom edge is the only strip left. */
        left: 12px;
        bottom: calc(clamp(48px, 11vw, 66px) + 22px);
        padding: 4px 10px;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 10px;
        box-shadow: 0 2px 0 var(--kf-shadow);
        color: var(--kf-ink-soft);
        font-size: 12px;
        pointer-events: none;
        max-width: 70%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    /* Keyboard hints are noise once the touch controls are up — EXCEPT the
       first-run walkthrough's own guidance, which teaches the touch binds and
       must stay visible on mobile (the tutorial set marks the box). */
    body.touch-on #hint { display: none; }
    body.touch-on #hint.tutorial-active { display: block; }

    /* The real HUD (spec/01 §4): clamp() sizing only, no breakpoints — the
       375/1280-green, 390/412/430-broken lesson. Every touch target >=44px. */
    /* This utility must beat later .touch-btn {display:flex} rules on PCs. */
    .hud-hidden { display: none !important; }
    body:not(.touch-on) .hud-skill { width: 48px; height: 36px; border-radius: 7px; cursor: default; }
    body:not(.touch-on) .hud-gauge { cursor: default; }
    .hud-skillbar {
        position: absolute;
        left: clamp(10px, 2.5vw, 26px);
        bottom: clamp(10px, 3vh, 26px);
        display: flex;
        gap: clamp(6px, 1.5vw, 14px);
        z-index: 30;
    }
    .hud-skill {
        position: relative;
        width: clamp(48px, 11vw, 66px);
        height: clamp(48px, 11vw, 66px);
        border-radius: 50%;
        background: var(--kf-paper);
        border: 2px solid var(--kf-ink-soft);
        color: var(--kf-ink);
        font-weight: 700;
        font-size: clamp(1rem, 3vw, 1.35rem);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        touch-action: none;
        cursor: pointer;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .hud-skill.hud-skill-ready { border-color: var(--kf-gold); }
    .hud-skill-cd {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
    }
    .hud-skill-secs {
        position: absolute;
        right: 4px;
        bottom: 2px;
        font-size: clamp(0.55rem, 1.6vw, 0.75rem);
        color: var(--kf-gold);
        pointer-events: none;
        text-shadow: 0 1px 0 var(--kf-paper);
    }
    .hud-gauge {
        position: absolute;
        right: clamp(10px, 2.5vw, 26px);
        bottom: clamp(10px, 3vh, 26px);
        width: clamp(150px, 32vw, 320px);
        height: clamp(18px, 3.2vh, 26px);
        z-index: 30;
        background: var(--kf-paper);
        border: 2px solid var(--kf-ink-soft);
        border-radius: 999px;
        box-shadow: 0 2px 0 var(--kf-shadow);
        overflow: hidden;
        touch-action: none;
        cursor: pointer;
    }
    .hud-gauge-fill {
        height: 100%;
        width: 0%;
        background: var(--kf-gold);
        border-radius: 999px;
        transition: width 0.15s linear;
    }
    .hud-gauge.ready .hud-gauge-fill {
        animation: hud-pulse 0.9s ease-in-out infinite alternate;
    }
    .hud-gauge-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(0.6rem, 1.8vw, 0.8rem);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--kf-ink);
        pointer-events: none;
        text-shadow: 0 1px 0 var(--kf-paper);
    }
    @keyframes hud-pulse {
        from { filter: brightness(1); }
        to { filter: brightness(1.4); }
    }

    /* Touch controls (游玩说明 §二). The joystick zone is the left half of the
       stage, under the skill bar in z-order so the icons keep their taps. */
    .touch-zone {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 50%;
        z-index: 20;
        touch-action: none;
    }
    .touch-stick {
        position: absolute;
        width: clamp(96px, 24vw, 132px);
        height: clamp(96px, 24vw, 132px);
        border-radius: 50%;
        border: 2px solid color-mix(in srgb, var(--kf-ink-soft) 60%, transparent);
        background: color-mix(in srgb, var(--kf-paper) 40%, transparent);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 21;
    }
    .touch-knob {
        position: absolute;
        width: clamp(44px, 11vw, 60px);
        height: clamp(44px, 11vw, 60px);
        border-radius: 50%;
        background: var(--kf-paper);
        border: 2px solid var(--kf-ink-soft);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 22;
    }
    .touch-btn {
        position: absolute;
        border-radius: 50%;
        background: var(--kf-paper);
        border: 2px solid var(--kf-ink-soft);
        color: var(--kf-ink);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        touch-action: none;
        cursor: pointer;
        z-index: 30;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .touch-attack {
        /* Stacks above the gauge: gauge bar + gap. */
        right: clamp(10px, 2.5vw, 26px);
        bottom: calc(clamp(10px, 3vh, 26px) + clamp(18px, 3.2vh, 26px)
                     + clamp(8px, 1.5vh, 14px));
        width: clamp(64px, 15vw, 96px);
        height: clamp(64px, 15vw, 96px);
        font-size: clamp(0.95rem, 3vw, 1.3rem);
    }
    .touch-dodge {
        right: clamp(10px, 2.5vw, 26px);
        bottom: calc(clamp(10px, 3vh, 26px) + clamp(18px, 3.2vh, 26px)
                     + clamp(8px, 1.5vh, 14px) + clamp(64px, 15vw, 96px)
                     + clamp(8px, 1.5vh, 14px));
        width: clamp(48px, 11vw, 66px);
        height: clamp(48px, 11vw, 66px);
        font-size: clamp(0.8rem, 2.4vw, 1.05rem);
    }
    .hud-pause {
        /* Below the top-left HUD block (floor/HP/coin), which is a padded
           paper chip since the token pass — hence the taller offset. */
        top: clamp(112px, 15vh, 140px);
        left: clamp(10px, 2.5vw, 26px);
        width: clamp(44px, 10vw, 56px);
        height: clamp(44px, 10vw, 56px);
        border-radius: 12px;
        font-size: clamp(0.85rem, 2.4vw, 1.05rem);
    }
    #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 12px;
        box-shadow: 0 2px 0 var(--kf-shadow);
        color: var(--kf-ink);
        font-family: var(--font-sans);
        user-select: none;
        pointer-events: none;
    }
    #hp-display {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--kf-ink);
    }
    #hp-display #hp-value { color: var(--kf-berry); }
    .player-health-track { height: 7px; margin-top: 5px; border-radius: 5px; overflow: hidden; background: #dce7dc; min-width: 132px; }
    .player-health-track i { display: block; height: 100%; transform: scaleX(var(--health, 1)); transform-origin: left; background: linear-gradient(90deg,#659f90,#a8dca7); transition: transform .12s linear; }
    .low-health .player-health-track i { background: linear-gradient(90deg,#c15e70,#f4a887); }
    .boss-readout { margin-top: 5px; font-size: 10px; color: #71617a; letter-spacing: .03em; }
    #coin-display {
        color: var(--kf-gold);
        font-weight: 600;
        font-size: 14px;
        margin-top: 4px;
    }
    #floor-display {
        color: var(--kf-ink-soft);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
    }
    #boss-bar {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 42%;
        min-width: 260px;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 12px;
        box-shadow: 0 2px 0 var(--kf-shadow);
        padding: 6px 12px;
        pointer-events: none;
    }
    #boss-bar .boss-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--kf-ink);
        margin-bottom: 4px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    #boss-bar .boss-track {
        height: 10px;
        background: var(--kf-mint);
        border: 1px solid var(--kf-ink-soft);
        border-radius: 999px;
        overflow: hidden;
    }
    #boss-bar .boss-fill {
        height: 100%;
        width: 100%;
        background: var(--kf-berry);
        transition: width 0.12s linear;
    }
    /* Boss opening voice subtitle (spec/05 §6 rule 5): a paper strip under
       the boss bar, pointer-transparent so it never eats a tap. */
    #boss-voice {
        position: absolute;
        top: 74px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 60%;
        min-width: 260px;
        background: rgba(255, 252, 245, 0.92);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 10px;
        padding: 5px 12px;
        text-align: center;
        pointer-events: none;
        z-index: 40;
    }
    #boss-voice .bv-name {
        font-size: 12px;
        font-weight: 700;
        color: var(--kf-berry);
        margin-right: 8px;
    }
    #boss-voice .bv-line {
        font-size: 13px;
        color: var(--kf-ink);
    }
    .panel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        /* Above the HUD/touch layer (z 20-30) so an open shop or menu owns
           its taps; below the dialogue (300) and the roster (1000). */
        z-index: 50;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 14px;
        padding: 18px 22px;
        min-width: 320px;
        max-width: 460px;
        color: var(--kf-ink);
        box-shadow: 0 6px 18px var(--kf-shadow);
    }
    .panel.hidden { display: none; }
    .panel h2 {
        margin: 0 0 12px;
        font-size: 16px;
        font-family: var(--font-serif);
        color: var(--kf-ink);
    }
    .panel button {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 8px 12px;
        background: var(--kf-paper);
        color: var(--kf-ink);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 999px;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .panel button:hover { border-color: var(--kf-gold); }
    .panel button:focus-visible {
        outline: 2px solid var(--kf-gold);
        outline-offset: 2px;
    }
    .panel label {
        display: block;
        margin-top: 12px;
        font-size: 13px;
        color: var(--kf-ink-soft);
    }
    .panel input[type="range"] { width: 100%; }
    #shop-items { display: flex; flex-direction: column; gap: 6px; }
    .shop-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: var(--kf-mint);
        border: 1px solid var(--kf-ink-soft);
        border-radius: 10px;
        cursor: pointer;
    }
    .shop-item:hover { border-color: var(--kf-gold); }
    .shop-item:focus-visible {
        outline: 2px solid var(--kf-gold);
        outline-offset: 2px;
    }
    .shop-item.sold {
        cursor: default;
        opacity: 0.45;
    }
    .shop-item .item-name { color: var(--kf-ink); font-weight: 600; }
    .shop-item .item-affixes { font-size: 12px; color: var(--kf-ink-soft); }
    .shop-item .item-price { color: var(--kf-gold); font-weight: 600; white-space: nowrap; }
    .shop-item.rarity-rare .item-name { color: var(--el-water); }
    .shop-item.rarity-epic .item-name { color: var(--el-moon); }
    .shop-item.rarity-legendary .item-name { color: var(--kf-gold); }
    #menu-panel .menu-note {
        margin-top: 12px;
        font-size: 12px;
        color: var(--kf-ink-soft);
    }

    /* 残页図鑑 (T13): full-screen overlay, same feel as the roster. The grid
       is auto-fill minmax(0,1fr) — no fixed width anywhere, so no width can
       produce horizontal overflow (the 375/1280-green, 390/412/430-broken
       lesson). */
    .codex-overlay {
        position: fixed;
        inset: 0;
        z-index: 1100;
        background: var(--kf-sky);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(8px, 2vmin, 20px);
        color: var(--kf-ink);
    }
    .codex-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex: 0 0 auto;
        margin-bottom: 8px;
    }
    .codex-head h3 {
        margin: 0;
        font-size: clamp(1.1rem, 3.5vw, 1.6rem);
        font-family: var(--font-serif);
        color: var(--kf-ink);
        letter-spacing: -0.02em;
    }
    .codex-count {
        font-size: clamp(0.85rem, 2.5vw, 1rem);
        color: var(--kf-ink-soft);
        font-variant-numeric: tabular-nums;
    }
    .codex-scroll {
        flex: 1 1 auto;
        min-height: 0;
        width: min(100% - 8px, 900px);
        overflow-y: auto;
        padding: 0 4px;
    }
    .codex-section {
        margin: 14px 0 8px;
        font-size: clamp(0.8rem, 2.2vw, 0.95rem);
        color: var(--kf-ink-soft);
        font-weight: 600;
    }
    .codex-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(0, 1fr));
        gap: 6px;
    }
    .codex-entry {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 4px;
        min-width: 0;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 10px;
        color: var(--kf-ink);
        cursor: pointer;
        font: inherit;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .codex-entry:hover { border-color: var(--kf-gold); }
    .codex-entry:focus-visible {
        outline: 2px solid var(--kf-gold);
        outline-offset: 2px;
    }
    .codex-entry img {
        width: 100%;
        max-width: 96px;
        height: auto;
        max-height: 110px;
        object-fit: cover;
        border-radius: 4px;
        pointer-events: none;
    }
    .codex-entry .codex-name {
        font-size: clamp(0.6rem, 1.8vw, 0.75rem);
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
    }
    .codex-entry.locked img {
        filter: grayscale(1);
        opacity: 0.55;
    }
    .codex-entry.locked .codex-name { color: var(--kf-ink-soft); }
    .codex-detail {
        flex: 0 0 auto;
        width: min(100% - 8px, 900px);
        min-height: 3.2em;
        margin-top: 8px;
        padding: 8px 12px;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 10px;
        font-size: clamp(0.75rem, 2vw, 0.9rem);
    }
    .codex-detail strong { color: var(--kf-ink); display: block; margin-bottom: 4px; }
    .codex-detail p { margin: 0 0 3px; line-height: 1.6; }
    .codex-detail p:last-child { margin-bottom: 0; }
    .codex-close {
        flex: 0 0 auto;
        margin-top: 8px;
        padding: 6px 22px;
        background: var(--kf-paper);
        color: var(--kf-ink);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .codex-close:hover { border-color: var(--kf-gold); }
    .codex-close:focus-visible {
        outline: 2px solid var(--kf-gold);
        outline-offset: 2px;
    }

    /* 敌人図鑑 (T22f): tab bar + model-snapshot art + element badges. The
       art box keeps the bust img's aspect slot (same grid math), whether the
       thumbnail has rendered or not — no layout shift when it lands. */
    .codex-tabs {
        display: flex;
        gap: 4px;
        margin-left: auto;
    }
    .codex-tab {
        padding: 4px 14px;
        background: var(--kf-paper);
        color: var(--kf-ink-soft);
        border: 1.5px solid var(--kf-ink-soft);
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        cursor: pointer;
        font: inherit;
        font-size: clamp(0.75rem, 2vw, 0.9rem);
    }
    .codex-tab.active {
        color: var(--kf-ink);
        border-color: var(--kf-gold);
        box-shadow: inset 0 -2px 0 var(--kf-gold);
    }
    .codex-tab:focus-visible {
        outline: 2px solid var(--kf-gold);
        outline-offset: 2px;
    }
    .codex-art {
        width: 100%;
        max-width: 96px;
        aspect-ratio: 144 / 160;
        background-color: var(--kf-shadow);
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        border-radius: 4px;
        color: var(--kf-ink-soft);
        font-size: 1.4rem;
        line-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }
    .codex-entry.locked .codex-art { opacity: 0.45; }
    .codex-el {
        display: inline-block;
        min-width: 1.4em;
        text-align: center;
        border: 1.5px solid currentColor;
        border-radius: 6px;
        padding: 0 2px;
        font-weight: 600;
    }
    .codex-el.el-0 { color: #d2553f; }   /* 炎 */
    .codex-el.el-1 { color: #3f7fd2; }   /* 水 */
    .codex-el.el-2 { color: #a08040; }   /* 土 */
    .codex-el.el-3 { color: #4fa060; }   /* 風 */
    .codex-el.el-4 { color: #8a6fd2; }   /* 月 */
    .codex-el.el-5 { color: #d2a83f; }   /* 日 */

    /* 成就 (plan 阶段 8): same overlay grammar as the codex — full-screen,
       auto-fill minmax(0,1fr) rows, no fixed width anywhere. Rows are plain
       divs (nothing to click through), so the interactive surface is just
       the close button; Esc also dismisses. */
    .achv-overlay {
        position: fixed;
        inset: 0;
        z-index: 1100;
        background: var(--kf-sky);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(8px, 2vmin, 20px);
        color: var(--kf-ink);
    }
    .achv-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex: 0 0 auto;
        margin-bottom: 8px;
    }
    .achv-head h3 {
        margin: 0;
        font-size: clamp(1.1rem, 3.5vw, 1.6rem);
        font-family: var(--font-serif);
        color: var(--kf-ink);
        letter-spacing: -0.02em;
    }
    .achv-count {
        font-size: clamp(0.85rem, 2.5vw, 1rem);
        color: var(--kf-ink-soft);
        font-variant-numeric: tabular-nums;
    }
    .achv-scroll {
        flex: 1 1 auto;
        min-height: 0;
        width: min(100% - 8px, 640px);
        overflow-y: auto;
        padding: 0 4px;
    }
    .achv-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        margin-bottom: 6px;
        min-width: 0;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 10px;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .achv-row .achv-star {
        flex: 0 0 auto;
        font-size: 1.2rem;
        line-height: 1;
        color: var(--kf-ink-soft);
    }
    .achv-row.done .achv-star { color: var(--kf-gold); }
    .achv-row .achv-body { min-width: 0; }
    .achv-row .achv-name {
        font-weight: 600;
        font-size: clamp(0.85rem, 2.4vw, 1rem);
        color: var(--kf-ink);
    }
    .achv-row.locked .achv-name { color: var(--kf-ink-soft); }
    .achv-row .achv-desc {
        font-size: clamp(0.72rem, 2vw, 0.85rem);
        color: var(--kf-ink-soft);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
    }
    .achv-close {
        flex: 0 0 auto;
        margin-top: 8px;
        padding: 6px 22px;
        background: var(--kf-paper);
        color: var(--kf-ink);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .achv-close:hover { border-color: var(--kf-gold); }
    .achv-close:focus-visible {
        outline: 2px solid var(--kf-gold);
        outline-offset: 2px;
    }

    /* 成就 toast: top-center, paper chip with the gold star accent. One at a
       time — a re-show restarts the timer instead of stacking. */
    #achv-toast {
        position: fixed;
        top: clamp(10px, 3vmin, 24px);
        left: 50%;
        transform: translateX(-50%) translateY(-8px);
        z-index: 1300;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: min(92vw, 420px);
        padding: 8px 16px;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-gold);
        border-radius: 999px;
        box-shadow: 0 3px 0 var(--kf-shadow);
        color: var(--kf-ink);
        font-size: clamp(0.8rem, 2.4vw, 0.95rem);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #achv-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
    #achv-toast .achv-toast-star { color: var(--kf-gold); }

    /* 操作说明 (plan 阶段 8「菜单、教学、成就」): same overlay grammar as the
       codex/成就 — full-screen --kf-sky page, clamp()/minmax() only, no fixed
       widths anywhere. Rows are plain divs; the interactive surface is the
       footer (重新教学 + 关闭), and Esc also dismisses. */
    .howto-overlay {
        position: fixed;
        inset: 0;
        z-index: 1100;
        background: var(--kf-sky);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(8px, 2vmin, 20px);
        color: var(--kf-ink);
    }
    .howto-head h3 {
        margin: 0 0 10px;
        font-size: clamp(1.1rem, 3.5vw, 1.6rem);
        font-family: var(--font-serif);
        color: var(--kf-ink);
        letter-spacing: -0.02em;
    }
    .howto-scroll {
        flex: 1 1 auto;
        min-height: 0;
        width: min(100% - 8px, 900px);
        overflow-y: auto;
        padding: 0 4px;
    }
    .howto-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 16px;
        margin-bottom: 10px;
        min-width: 0;
        background: var(--kf-paper);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 12px;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .howto-card-title {
        margin: 0;
        font-size: clamp(0.9rem, 2.6vw, 1.05rem);
        color: var(--kf-ink);
    }
    .howto-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 0;
        min-width: 0;
    }
    .howto-row.touch {
        align-items: flex-start;
    }
    .howto-keys {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
    }
    .howto-key {
        min-width: calc(2ch + 10px);
        min-height: 34px;
        padding: 2px 8px;
        background: var(--kf-paper);
        color: var(--kf-ink);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 8px;
        font: 600 0.9rem/1.4 var(--kf-ff-sans, "Segoe UI");
        box-shadow: 0 2px 0 var(--kf-shadow);
        text-align: center;
    }
    .howto-label {
        flex: 1 1 auto;
        min-width: 0;
        font-size: clamp(0.76rem, 2.1vw, 0.9rem);
        color: var(--kf-ink);
        line-height: 1.5;
    }
    .howto-desc {
        font-size: clamp(0.74rem, 2vw, 0.85rem);
        color: var(--kf-ink-soft);
        line-height: 1.5;
    }
    .howto-footer {
        flex: 0 0 auto;
        display: flex;
        gap: 10px;
        margin-top: 8px;
    }
    .howto-again,
    .howto-close {
        padding: 6px 18px;
        background: var(--kf-paper);
        color: var(--kf-ink);
        border: 1.5px solid var(--kf-ink-soft);
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        box-shadow: 0 2px 0 var(--kf-shadow);
    }
    .howto-again {
        border-color: var(--kf-gold);
        color: var(--kf-gold);
    }
    .howto-again:hover,
    .howto-close:hover { border-color: var(--kf-gold); }
    .howto-again:focus-visible,
    .howto-close:focus-visible {
        outline: 2px solid var(--kf-gold);
        outline-offset: 2px;
    }

</style>
<link rel="stylesheet" href="./rl/ui/theme.css">
<link rel="stylesheet" href="./rl/ui/story.css">
<link rel="stylesheet" href="../css/kirara-cursor.css">
</head>
<body>
<div id="bar">
    <h1>百物语的残页 <span class="game-edition">きらファン外传</span></h1>
    <span id="status" role="status">读取中…</span>
</div>
<div id="stage">
    <!-- Room-transition cover (T21d): colour and timing driven from
         rl/main.js; styles in rl/ui/theme.css. -->
    <div id="room-fade" aria-hidden="true"></div>
    <div id="hud">
        <div id="floor-display"></div>
        <div id="hp-display">生命 <span id="hp-value">0</span> / <span id="hp-max">0</span><div class="player-health-track"><i></i></div></div>
        <div id="coin-display">金币: <span id="coin-value">0</span></div>
    </div>
    <div id="boss-bar" style="display:none">
        <div class="boss-name"></div>
        <div class="boss-track"><div class="boss-fill"></div></div>
        <div class="boss-readout"></div>
        <div class="boss-counter" hidden></div>
    </div>
    <div id="boss-voice" style="display:none" aria-live="polite">
        <span class="bv-name"></span><span class="bv-line"></span>
    </div>
    <div id="minimap"></div>
    <div id="hint" role="status" hidden></div>
    <dialog id="shop-panel" class="panel hidden" aria-label="商店">
        <h2>商店 · <span id="shop-coin">金币 0</span></h2>
        <div id="shop-items"></div>
        <button id="shop-close">关闭</button>
    </dialog>
    <div id="menu-panel" class="panel hidden">
        <h2>菜单</h2>
        <button id="menu-resume">继续</button>
        <div id="menu-equipment-model" hidden>
            <p id="menu-equipment-status" role="status"></p>
            <button id="menu-equipment-retry" type="button">重试武器外观</button>
        </div>
        <button id="menu-codex">残页图鉴</button>
        <button id="menu-skills">技能说明</button>
        <button id="menu-equipment">装备与武器图鉴</button>
        <button id="menu-storage">存档与备份</button>
        <button id="menu-achv">成就</button>
        <button id="menu-howto">操作说明</button>
        <label>BGM 音量 <input type="range" id="menu-volume" min="0" max="100" value="50"></label>
        <label>SE 音量 <input type="range" id="menu-sevol" min="0" max="100" value="50"></label>
        <label>视野 / 镜头高度 <input type="range" id="menu-cam" min="55" max="130" step="5" value="90" aria-description="向右调节可扩大可见范围"></label>
        <label>画质 <select id="menu-quality" aria-description="流畅档降低渲染像素比与拖尾粒子，战斗判定不变">
            <option value="high">还原（2倍以上像素比）</option>
            <option value="balanced">均衡</option>
            <option value="performance">流畅</option>
        </select></label>
        <label><input type="checkbox" id="menu-reduced-shake"> 减少受击震动</label>
        <label><input type="checkbox" id="menu-reduced-flash"> 减少受击闪烁</label>
        <label><input type="checkbox" id="menu-simplified-ultimates"> 简化必杀演出</label>
        <button id="menu-restart">重新出发</button>
        <div class="menu-note">WASD 移动 · J/左键 攻击 · K/空格 闪避 · 2/3 技能 · R/1 必杀 · E 互动</div>
    </div>
</div>

<!-- 成就达成 toast: filled by ui/achievements.js showAchievementToast. -->
<div id="achv-toast"></div>

<!-- Card data as a plain script so window.kirafanGachaData exists before any
     module runs. -->
<script src="../asset/gacha/cards.js"></script>
<!-- Dialogue scripts (T12): every file merges into window.kirafanDialogue, so
     order is free; original-characters.js supplies the メディア/ハイプリス
     roster entries the dialogue resolver also accepts. -->
<script src="../asset/original-characters.js"></script>
<script src="../asset/rl/dialogue/main.js"></script>
<script src="../asset/rl/dialogue/boss.js"></script>
<script src="../asset/rl/dialogue/rest_1.js"></script>
<script src="../asset/rl/dialogue/rest_2.js"></script>
<script src="../asset/rl/dialogue/rest_3.js"></script>
<script src="../asset/rl/dialogue/exit.js"></script>
<script src="../asset/rl/dialogue/pages.js"></script>
<script src="../asset/rl/dialogue/finale.js"></script>
<script src="../asset/rl/dialogue/tutorial.js"></script>
<script src="../asset/rl/dialogue/turns.js"></script>
<script src="../asset/rl/dialogue/conditional.js"></script>
<script src="../asset/rl/dialogue/returns.js"></script>
<script type="module" src="./rl/main.js?v=20260908-2"></script>
<!-- 构建徽标: 用户报「没修好」时第一件事是核对这行——如果看到的不是
     当前日期/批次号，说明 tab 里跑的是旧模块（页面常开不刷新时 no-store
     也救不了内存里的 ES module），Ctrl+F5 即可。 -->
<script>
    window.addEventListener("DOMContentLoaded", function () {
        if (new URLSearchParams(location.search).get("debug") !== "1") { return; }
        var badge = document.createElement("div");
        badge.id = "build-badge";
        badge.textContent = "BUILD 2026-09-10 UI";
        badge.style.cssText = "position:fixed;bottom:2px;right:6px;"
            + "font:10px monospace;color:#8a8f9a;z-index:9999;"
            + "pointer-events:none;user-select:none";
        document.body.appendChild(badge);
    });
</script>
</body>
